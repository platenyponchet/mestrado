[project]
name = "mestrado"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotext>=6.0.0",
    "psutil>=7.2.2",
    "pywavelets>=1.9.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
